<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00b894"/>
      <stop offset="100%" style="stop-color:#00cec9"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" rx="16"/>
  <!-- Football field lines -->
  <rect x="50" y="100" width="300" height="200" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
  <line x1="200" y1="100" x2="200" y2="300" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
  <circle cx="200" cy="200" r="40" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.3"/>
  <!-- Football -->
  <circle cx="200" cy="200" r="50" fill="#ffffff"/>
  <path d="M200 150 L220 180 L200 200 L180 180 Z" fill="#2d3436"/>
  <path d="M200 200 L220 180 L250 190 L230 210 Z" fill="#2d3436"/>
  <path d="M200 200 L230 210 L220 240 L200 250 Z" fill="#2d3436"/>
  <path d="M200 200 L200 250 L170 240 L180 210 Z" fill="#2d3436"/>
  <path d="M200 200 L180 210 L150 190 L180 180 Z" fill="#2d3436"/>
  <path d="M200 200 L180 180 L200 150 L220 180 Z" fill="#2d3436"/>
  <!-- Trophy -->
  <path d="M170 320 L170 350 L230 350 L230 320" fill="#fdcb6e"/>
  <rect x="160" y="350" width="80" height="10" rx="3" fill="#fdcb6e"/>
  <path d="M170 320 Q140 320 140 300 Q140 280 170 280" fill="none" stroke="#fdcb6e" stroke-width="4"/>
  <path d="M230 320 Q260 320 260 300 Q260 280 230 280" fill="none" stroke="#fdcb6e" stroke-width="4"/>
  <!-- Stars -->
  <text x="185" y="310" font-size="20" fill="#fdcb6e">★</text>
  <text x="195" y="310" font-size="20" fill="#fdcb6e">★</text>
  <text x="205" y="310" font-size="20" fill="#fdcb6e">★</text>
  <!-- Text -->
  <text x="200" y="70" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="32" font-weight="900" fill="#ffffff">SPORTS</text>
  <text x="200" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" letter-spacing="6">CHAMPION</text>
</svg>