<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d3436"/>
      <stop offset="100%" style="stop-color:#0a0a1a"/>
    </linearGradient>
    <linearGradient id="fire" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#e94560"/>
      <stop offset="50%" style="stop-color:#fdcb6e"/>
      <stop offset="100%" style="stop-color:#ffffff"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" rx="16"/>
  <!-- Flame -->
  <path d="M200 80 Q220 120 240 160 Q260 200 240 240 Q220 280 200 300 Q180 280 160 240 Q140 200 160 160 Q180 120 200 80" fill="url(#fire)"/>
  <path d="M200 120 Q210 140 220 160 Q230 180 220 200 Q210 220 200 240 Q190 220 180 200 Q170 180 180 160 Q190 140 200 120" fill="#fdcb6e" opacity="0.8"/>
  <!-- Dumbbell -->
  <rect x="140" y="320" width="120" height="8" rx="4" fill="#dfe6e9"/>
  <rect x="120" y="310" width="25" height="28" rx="4" fill="#636e72"/>
  <rect x="255" y="310" width="25" height="28" rx="4" fill="#636e72"/>
  <!-- Quote marks -->
  <text x="80" y="100" font-family="Georgia, serif" font-size="60" fill="#ffffff" opacity="0.3">"</text>
  <text x="300" y="380" font-family="Georgia, serif" font-size="60" fill="#ffffff" opacity="0.3">"</text>
  <!-- Text -->
  <text x="200" y="380" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="24" font-weight="900" fill="#ffffff">GRIND</text>
</svg>