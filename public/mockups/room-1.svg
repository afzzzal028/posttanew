<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="wall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f0eb"/>
      <stop offset="100%" style="stop-color:#e8e0d8"/>
    </linearGradient>
  </defs>
  <!-- Room -->
  <rect width="600" height="400" fill="url(#wall)"/>
  <!-- Floor -->
  <rect x="0" y="300" width="600" height="100" fill="#c4a882"/>
  <line x1="0" y1="300" x2="600" y2="300" stroke="#b89b72" stroke-width="2"/>
  <!-- Posters on wall -->
  <rect x="80" y="60" width="100" height="140" fill="#1a1a2e" stroke="#fff" stroke-width="3"/>
  <rect x="85" y="65" width="90" height="130" fill="#e94560"/>
  <text x="130" y="140" text-anchor="middle" font-family="Arial" font-size="10" fill="#fff" font-weight="bold">PORSCHE</text>
  
  <rect x="200" y="40" width="80" height="120" fill="#1a1a2e" stroke="#fff" stroke-width="3"/>
  <rect x="205" y="45" width="70" height="110" fill="#6c5ce7"/>
  <text x="240" y="105" text-anchor="middle" font-family="Arial" font-size="9" fill="#fff" font-weight="bold">NARUTO</text>
  
  <rect x="300" y="70" width="90" height="130" fill="#1a1a2e" stroke="#fff" stroke-width="3"/>
  <rect x="305" y="75" width="80" height="120" fill="#00b894"/>
  <text x="345" y="140" text-anchor="middle" font-family="Arial" font-size="9" fill="#fff" font-weight="bold">GAMING</text>
  
  <rect x="410" y="50" width="70" height="100" fill="#1a1a2e" stroke="#fff" stroke-width="3"/>
  <rect x="415" y="55" width="60" height="90" fill="#fd79a8"/>
  <text x="445" y="105" text-anchor="middle" font-family="Arial" font-size="8" fill="#fff" font-weight="bold">MUSIC</text>
  
  <rect x="500" y="80" width="80" height="110" fill="#1a1a2e" stroke="#fff" stroke-width="3"/>
  <rect x="505" y="85" width="70" height="100" fill="#0984e3"/>
  <text x="540" y="140" text-anchor="middle" font-family="Arial" font-size="9" fill="#fff" font-weight="bold">F1</text>
  
  <!-- Small cards row -->
  <rect x="100" y="220" width="50" height="70" fill="#1a1a2e" stroke="#fff" stroke-width="2"/>
  <rect x="103" y="223" width="44" height="64" fill="#e17055"/>
  
  <rect x="160" y="220" width="50" height="70" fill="#1a1a2e" stroke="#fff" stroke-width="2"/>
  <rect x="163" y="223" width="44" height="64" fill="#00cec9"/>
  
  <rect x="220" y="220" width="50" height="70" fill="#1a1a2e" stroke="#fff" stroke-width="2"/>
  <rect x="223" y="223" width="44" height="64" fill="#fdcb6e"/>
  
  <rect x="280" y="220" width="50" height="70" fill="#1a1a2e" stroke="#fff" stroke-width="2"/>
  <rect x="283" y="223" width="44" height="64" fill="#a29bfe"/>
  
  <rect x="340" y="220" width="50" height="70" fill="#1a1a2e" stroke="#fff" stroke-width="2"/>
  <rect x="343" y="223" width="44" height="64" fill="#ff7675"/>
  
  <!-- Desk -->
  <rect x="150" y="310" width="300" height="15" fill="#8B7355"/>
  <rect x="160" y="325" width="10" height="60" fill="#8B7355"/>
  <rect x="430" y="325" width="10" height="60" fill="#8B7355"/>
  <!-- Monitor -->
  <rect x="250" y="260" width="100" height="50" fill="#2d3436"/>
  <rect x="255" y="265" width="90" height="40" fill="#0a0a1a"/>
  <rect x="290" y="310" width="20" height="10" fill="#636e72"/>
  <!-- Plant -->
  <rect x="480" y="270" width="30" height="30" fill="#636e72"/>
  <circle cx="495" cy="260" r="20" fill="#00b894"/>
  <circle cx="485" cy="250" r="15" fill="#00cec9"/>
  <circle cx="505" cy="255" r="12" fill="#55a38a"/>
</svg>