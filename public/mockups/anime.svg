<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="100%" style="stop-color:#ee5a24"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" rx="16"/>
  <!-- Energy aura -->
  <circle cx="200" cy="200" r="120" fill="none" stroke="#ffeaa7" stroke-width="3" opacity="0.3"/>
  <circle cx="200" cy="200" r="100" fill="none" stroke="#ffeaa7" stroke-width="2" opacity="0.2"/>
  <!-- Character silhouette -->
  <circle cx="200" cy="140" r="40" fill="#2d3436"/>
  <rect x="175" y="175" width="50" height="80" rx="10" fill="#2d3436"/>
  <!-- Hair spikes -->
  <polygon points="160,130 170,100 180,130" fill="#2d3436"/>
  <polygon points="175,120 185,85 195,120" fill="#2d3436"/>
  <polygon points="195,125 205,90 215,125" fill="#2d3436"/>
  <polygon points="215,130 225,100 235,130" fill="#2d3436"/>
  <!-- Eyes -->
  <circle cx="185" cy="135" r="6" fill="#ffffff"/>
  <circle cx="215" cy="135" r="6" fill="#ffffff"/>
  <circle cx="185" cy="135" r="3" fill="#e94560"/>
  <circle cx="215" cy="135" r="3" fill="#e94560"/>
  <!-- Power effect -->
  <path d="M160 280 L180 250 L170 270 L190 240 L185 260 L200 230 L195 255 L215 225 L205 250 L225 235 L215 260 L240 240 L225 265 L250 250 L230 275" stroke="#ffeaa7" stroke-width="4" fill="none" opacity="0.8"/>
  <!-- Text -->
  <text x="200" y="340" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="32" font-weight="900" fill="#ffffff">ANIME</text>
  <text x="200" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#ffeaa7" letter-spacing="6">POWER UP</text>
</svg>