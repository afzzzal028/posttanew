<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2d3436"/>
      <stop offset="100%" style="stop-color:#0a0a1a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" rx="16"/>
  <!-- Film reel -->
  <circle cx="120" cy="100" r="40" fill="none" stroke="#dfe6e9" stroke-width="3"/>
  <circle cx="120" cy="100" r="10" fill="#dfe6e9"/>
  <circle cx="280" cy="100" r="40" fill="none" stroke="#dfe6e9" stroke-width="3"/>
  <circle cx="280" cy="100" r="10" fill="#dfe6e9"/>
  <!-- Film strip -->
  <rect x="80" y="100" width="240" height="20" fill="#636e72"/>
  <rect x="90" y="103" width="15" height="14" fill="#2d3436"/>
  <rect x="115" y="103" width="15" height="14" fill="#2d3436"/>
  <rect x="140" y="103" width="15" height="14" fill="#2d3436"/>
  <rect x="165" y="103" width="15" height="14" fill="#2d3436"/>
  <rect x="190" y="103" width="15" height="14" fill="#2d3436"/>
  <rect x="215" y="103" width="15" height="14" fill="#2d3436"/>
  <rect x="240" y="103" width="15" height="14" fill="#2d3436"/>
  <rect x="265" y="103" width="15" height="14" fill="#2d3436"/>
  <!-- Screen -->
  <rect x="80" y="150" width="240" height="150" rx="8" fill="#0a0a1a" stroke="#636e72" stroke-width="2"/>
  <rect x="90" y="160" width="220" height="130" fill="#1a1a2e"/>
  <!-- Play button -->
  <polygon points="190,200 190,260 240,230" fill="#e94560" opacity="0.9"/>
  <!-- Text -->
  <text x="200" y="340" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="28" font-weight="900" fill="#ffffff">MOVIES</text>
  <text x="200" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#dfe6e9" letter-spacing="6">CINEMA</text>
</svg>