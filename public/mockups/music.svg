<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fd79a8"/>
      <stop offset="100%" style="stop-color:#e84393"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)" rx="16"/>
  <!-- Vinyl record -->
  <circle cx="200" cy="180" r="100" fill="#2d3436"/>
  <circle cx="200" cy="180" r="90" fill="#636e72"/>
  <circle cx="200" cy="180" r="30" fill="#e94560"/>
  <circle cx="200" cy="180" r="10" fill="#2d3436"/>
  <!-- Grooves -->
  <circle cx="200" cy="180" r="80" fill="none" stroke="#2d3436" stroke-width="1"/>
  <circle cx="200" cy="180" r="70" fill="none" stroke="#2d3436" stroke-width="1"/>
  <circle cx="200" cy="180" r="60" fill="none" stroke="#2d3436" stroke-width="1"/>
  <circle cx="200" cy="180" r="50" fill="none" stroke="#2d3436" stroke-width="1"/>
  <!-- Music notes -->
  <text x="60" y="120" font-size="30" fill="#ffffff" opacity="0.8">♪</text>
  <text x="320" y="150" font-size="25" fill="#ffffff" opacity="0.7">♫</text>
  <text x="80" y="280" font-size="20" fill="#ffffff" opacity="0.6">♪</text>
  <text x="300" y="250" font-size="28" fill="#ffffff" opacity="0.5">♫</text>
  <!-- Headphones -->
  <path d="M130 180 Q130 120 200 120 Q270 120 270 180" fill="none" stroke="#ffffff" stroke-width="8"/>
  <rect x="115" y="170" width="25" height="40" rx="8" fill="#ffffff"/>
  <rect x="260" y="170" width="25" height="40" rx="8" fill="#ffffff"/>
  <!-- Text -->
  <text x="200" y="330" text-anchor="middle" font-family="Arial Black, sans-serif" font-size="28" font-weight="900" fill="#ffffff">MUSIC</text>
  <text x="200" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#ffffff" letter-spacing="6">VIBE ON</text>
</svg>